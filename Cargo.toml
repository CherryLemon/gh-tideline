[package]
name = "gh-tideline"
version = "0.3.0"
edition = "2024"
description = "IDE-grade diffs for GitHub pull requests, in your browser, without cloning."
license = "MIT"
repository = "https://github.com/CherryLemon/gh-tideline"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.27.1"
tree-sitter-typescript = "0.23.2"
webbrowser = "1.2.4"
